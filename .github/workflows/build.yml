name: Build ipk and apk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "OpenWrt 24.10 (ipk)"
            container: "ghcr.io/openwrt/sdk:24.10"
            package_format: "ipk"
          - name: "OpenWrt main (apk)"
            container: "ghcr.io/openwrt/sdk:main"
            package_format: "apk"
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare feeds and package
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base rpcd-mod-luci
          mkdir -p package/feeds/luci/luci-app-static-gw
          cp -r $GITHUB_WORKSPACE/* package/feeds/luci/luci-app-static-gw/
          rm -rf package/feeds/luci/luci-app-static-gw/.git package/feeds/luci/luci-app-static-gw/.github

      - name: Build package
        run: |
          make package/feeds/luci/luci-app-static-gw/compile -j$(nproc) V=0 || make package/feeds/luci/luci-app-static-gw/compile -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/artifacts
          if [ "${{ matrix.package_format }}" = "ipk" ]; then
            find bin -name "luci-app-static-gw*.ipk" -exec cp {} /tmp/artifacts/ \;
          else
            find bin -name "luci-app-static-gw*.apk" -exec cp {} /tmp/artifacts/ \;
          fi
          ls -la /tmp/artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-static-gw-${{ matrix.package_format }}
          path: /tmp/artifacts/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected packages
        run: ls -la artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Continuous Build
          draft: false
          prerelease: true
          files: |
            artifacts/*.ipk
            artifacts/*.apk
          generate_release_notes: false
          body: |
            Automatic build from ${{ github.sha }}

            - `luci-app-static-gw_*.ipk` — for OpenWrt 24.10 / opkg
            - `luci-app-static-gw_*.apk` — for OpenWrt 25+ / apk

            Both are Architecture: all.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
