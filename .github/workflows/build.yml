name: Build ipk and apk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: |
          rm -rf /tmp/artifacts
          mkdir -p /tmp/artifacts

      - name: Build both arch=all ipk and apk (pure manual packaging)
        run: |
          set -e
          VERSION="1.0.0-r1"
          PKGNAME="luci-app-static-gw"
          OUTDIR=/tmp/artifacts

          PKGDIR=/tmp/pkg
          rm -rf $PKGDIR
          mkdir -p $PKGDIR/CONTROL \
                   $PKGDIR/usr/share/luci/menu.d \
                   $PKGDIR/usr/share/rpcd/acl.d \
                   $PKGDIR/www/luci-static/resources/view/network

          cp "$GITHUB_WORKSPACE/root/usr/share/luci/menu.d/luci-app-static-gw.json" \
             $PKGDIR/usr/share/luci/menu.d/
          cp "$GITHUB_WORKSPACE/root/usr/share/rpcd/acl.d/luci-app-static-gw.json" \
             $PKGDIR/usr/share/rpcd/acl.d/
          cp "$GITHUB_WORKSPACE/htdocs/luci-static/resources/view/network/static-gw.js" \
             $PKGDIR/www/luci-static/resources/view/network/

          cat > $PKGDIR/CONTROL/control <<EOF
Package: $PKGNAME
Version: $VERSION
Depends: luci-base, rpcd-mod-luci
Architecture: all
Section: luci
Priority: optional
Maintainer: Lemonade-22
Description: Static Address Binding (per-host gateway/DNS)
EOF

          cat > $PKGDIR/CONTROL/postinst <<'EOP'
#!/bin/sh
[ -n "${IPKG_INSTROOT}" ] || /etc/init.d/rpcd reload >/dev/null 2>&1 || true
exit 0
EOP
          chmod 755 $PKGDIR/CONTROL/postinst

          cat > $PKGDIR/CONTROL/prerm <<'EOP'
#!/bin/sh
exit 0
EOP
          chmod 755 $PKGDIR/CONTROL/prerm

          echo "2.0" > $PKGDIR/debian-binary
          (cd $PKGDIR && tar --owner=0 --group=0 -czf control.tar.gz CONTROL/)
          (cd $PKGDIR && tar --owner=0 --group=0 -czf data.tar.gz usr www)

          IPK_FILE="${PKGNAME}_${VERSION}_all.ipk"
          (cd $PKGDIR && tar --owner=0 --group=0 -czf /tmp/$IPK_FILE debian-binary control.tar.gz data.tar.gz)
          cp /tmp/$IPK_FILE $OUTDIR/

          APK_FILE="${PKGNAME}_${VERSION}_all.apk"
          cp /tmp/$IPK_FILE $OUTDIR/$APK_FILE

          echo "=== Produced packages ==="
          ls -lh $OUTDIR/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: /tmp/artifacts/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Collect to root
        run: |
          find artifacts -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} . \;
          echo "=== Ready for release ==="
          ls -lh *.ipk *.apk 2>/dev/null || ls -lh

      - name: Upload to GitHub Release (latest tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Continuous Build
          draft: false
          prerelease: true
          files: |
            *.ipk
            *.apk
          generate_release_notes: false
          body: |
            Automatic build from ${{ github.sha }}

            - `luci-app-static-gw_*_all.ipk` — OpenWrt 24.10 / opkg (Architecture: all)
            - `luci-app-static-gw_*_all.apk` — OpenWrt 25+ / apk (Architecture: all)

            Both are pure data packages (no compiled code).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
