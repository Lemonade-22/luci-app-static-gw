name: Build ipk and apk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            label: "OpenWrt 24.10 (opkg / ipk)"
            sdk_index: "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/"
          - format: apk
            label: "OpenWrt snapshot (apk-tools 3 / apk)"
            sdk_index: "https://downloads.openwrt.org/snapshots/targets/x86/64/"

    name: build-${{ matrix.format }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with official OpenWrt SDK (${{ matrix.label }})
        run: bash Scripts/ci-build.sh "${{ matrix.format }}" "${{ matrix.sdk_index }}"

      - name: Upload ${{ matrix.format }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.format }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and build tag
        id: meta
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1)"
          REL="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1)"
          DATE="$(date -u +%Y%m%d-%H%M)"
          SHORT="${GITHUB_SHA::7}"
          TAG="v${VER}-r${REL}-${DATE}-run${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=luci-app-static-gw v${VER}-r${REL} · ${SHORT} · ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected packages
        run: ls -lh dist

      - name: Publish a dedicated release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.ipk
            dist/*.apk
            dist/*.pem
          body: |
            Build of commit `${{ github.sha }}` (${{ steps.meta.outputs.short }}), run ${{ github.run_number }}.

            Every build publishes its own release, so pick the version you need
            from the release list instead of reusing a shared tag.

            | File | Target |
            | --- | --- |
            | `luci-app-static-gw_*_all.ipk` | OpenWrt 24.10 and older (opkg) |
            | `luci-i18n-static-gw-zh-cn_*_all.ipk` | Simplified Chinese UI (opkg) |
            | `luci-app-static-gw-*.apk` | OpenWrt snapshot / 25.x (apk) |
            | `luci-i18n-static-gw-zh-cn-*.apk` | Simplified Chinese UI (apk) |
            | `luci-app-static-gw-signing-key.pem` | public key that signed the `.apk` |

            Both packages are architecture independent (`Architecture: all`) -
            the application contains only LuCI JS/JSON and translations, no
            compiled code, so a single file serves every device.

            ### Install on opkg (24.10)

            ```sh
            opkg install luci-app-static-gw_*_all.ipk
            opkg install luci-i18n-static-gw-zh-cn_*_all.ipk   # optional, Chinese UI
            ```

            ### Install on apk (snapshot / 25.x)

            The `.apk` is signed with this repository's CI build key. A device
            does not trust that key by default, which shows up as
            `ERROR: ...: UNTRUSTED signature` (exit code 99).

            Trust the key once, then install normally:

            ```sh
            cp luci-app-static-gw-signing-key.pem /etc/apk/keys/
            apk add luci-app-static-gw-*.apk
            apk add luci-i18n-static-gw-zh-cn-*.apk   # optional, Chinese UI
            ```

            For a one-off install without trusting the key:

            ```sh
            apk add --allow-untrusted luci-app-static-gw-*.apk
            apk add --allow-untrusted luci-i18n-static-gw-zh-cn-*.apk
            ```

            After installing, reload LuCI and open **Network → Static Address
            Binding**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
