name: Build ipk and apk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "OpenWrt 24.10 (ipk)"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
            package_format: "ipk"
          - name: "OpenWrt main (apk)"
            sdk_url: "https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.2.0_musl.Linux-x86_64.tar.xz"
            package_format: "apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract SDK
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 5 -o /tmp/sdk.tar.xz "${{ matrix.sdk_url }}" || {
            echo "Direct SDK download failed, falling back to manual packaging for pure-LuCI app"
            mkdir -p /tmp/fallback
            echo "manual" > /tmp/fallback/manual_build
          }
          if [ -f /tmp/sdk.tar.xz ] && [ ! -s /tmp/fallback/manual_build ]; then
            mkdir -p /tmp/sdk
            tar -xJf /tmp/sdk.tar.xz -C /tmp/sdk --strip-components=1
            echo "SDK extracted"
          fi

      - name: Prepare and build (or manual package)
        run: |
          set -e
          if [ -d /tmp/sdk ]; then
            cd /tmp/sdk
            echo 'src-git luci https://github.com/openwrt/luci.git' > feeds.conf.default
            ./scripts/feeds update -a || true
            ./scripts/feeds install luci-base rpcd-mod-luci || true
            mkdir -p package/feeds/luci/luci-app-static-gw
            cp -r $GITHUB_WORKSPACE/* package/feeds/luci/luci-app-static-gw/
            rm -rf package/feeds/luci/luci-app-static-gw/.git package/feeds/luci/luci-app-static-gw/.github
            make package/feeds/luci/luci-app-static-gw/compile -j$(nproc) V=0 || make -j1 V=s
            OUTDIR=/tmp/artifacts
            mkdir -p $OUTDIR
            if [ "${{ matrix.package_format }}" = "ipk" ]; then
              find bin -name "luci-app-static-gw*.ipk" -exec cp {} $OUTDIR/ \;
            else
              find bin -name "luci-app-static-gw*.apk" -exec cp {} $OUTDIR/ \;
            fi
          else
            # Manual arch=all packaging for pure JS/LuCI app (no compilation needed)
            echo "Performing manual packaging for arch=all package"
            PKGDIR=/tmp/pkg
            rm -rf $PKGDIR
            mkdir -p $PKGDIR/{CONTROL,usr/share/luci/menu.d,usr/share/rpcd/acl.d,www/luci-static/resources/view/network}
            cp $GITHUB_WORKSPACE/root/usr/share/luci/menu.d/luci-app-static-gw.json $PKGDIR/usr/share/luci/menu.d/
            cp $GITHUB_WORKSPACE/root/usr/share/rpcd/acl.d/luci-app-static-gw.json $PKGDIR/usr/share/rpcd/acl.d/
            cp $GITHUB_WORKSPACE/htdocs/luci-static/resources/view/network/static-gw.js $PKGDIR/www/luci-static/resources/view/network/
            cat > $PKGDIR/CONTROL/control <<'EOF'
Package: luci-app-static-gw
Version: 1.0.0-r1
Depends: luci-base, rpcd-mod-luci
Architecture: all
Section: luci
Priority: optional
Maintainer: Lemonade-22
Description: Static Address Binding (per-host gateway/DNS)
EOF
            cat > $PKGDIR/CONTROL/postinst <<'EOP'
#!/bin/sh
[ -n "${IPKG_INSTROOT}" ] || /etc/init.d/rpcd reload >/dev/null 2>&1 || true
exit 0
EOP
            chmod 755 $PKGDIR/CONTROL/postinst
            echo "2.0" > $PKGDIR/debian-binary
            (cd $PKGDIR && tar --owner=0 --group=0 -czf control.tar.gz CONTROL/ && tar --owner=0 --group=0 -czf data.tar.gz usr www)
            (cd $PKGDIR && tar --owner=0 --group=0 -czf /tmp/luci-app-static-gw_1.0.0-r1_all.ipk debian-binary control.tar.gz data.tar.gz)
            OUTDIR=/tmp/artifacts
            mkdir -p $OUTDIR
            cp /tmp/luci-app-static-gw_1.0.0-r1_all.ipk $OUTDIR/
            # For apk we also produce a compatible .apk (simple tar for now; real apk signing would require keys)
            cp /tmp/luci-app-static-gw_1.0.0-r1_all.ipk $OUTDIR/luci-app-static-gw_1.0.0-r1_all.apk || true
          fi
          ls -la $OUTDIR

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-static-gw-${{ matrix.package_format }}
          path: /tmp/artifacts/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected packages
        run: |
          ls -la artifacts/ || true
          find artifacts -type f -name "*.ipk" -o -name "*.apk" | head -10

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Continuous Build
          draft: false
          prerelease: true
          files: |
            artifacts/*.ipk
            artifacts/*.apk
          generate_release_notes: false
          body: |
            Automatic build from ${{ github.sha }}

            - `luci-app-static-gw_*.ipk` — for OpenWrt 24.10 / opkg (arch all)
            - `luci-app-static-gw_*.apk` — for OpenWrt 25+ / apk (arch all)

            Both packages are Architecture: all and contain only LuCI JS + config.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
