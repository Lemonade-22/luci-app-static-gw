name: Build ipk and apk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          rm -rf /tmp/out
          mkdir -p /tmp/out

      - name: Package ipk (arch=all)
        run: |
          set -e
          V="1.0.0-r1"
          P="luci-app-static-gw"
          D=/tmp/pkg-ipk
          rm -rf $D
          mkdir -p $D/CONTROL $D/usr/share/luci/menu.d $D/usr/share/rpcd/acl.d $D/www/luci-static/resources/view/network

          cp root/usr/share/luci/menu.d/luci-app-static-gw.json $D/usr/share/luci/menu.d/
          cp root/usr/share/rpcd/acl.d/luci-app-static-gw.json $D/usr/share/rpcd/acl.d/
          cp htdocs/luci-static/resources/view/network/static-gw.js $D/www/luci-static/resources/view/network/

          cat > $D/CONTROL/control <<EOF
Package: $P
Version: $V
Depends: luci-base, rpcd-mod-luci
Architecture: all
Section: luci
Priority: optional
Maintainer: Lemonade-22
Description: Static Address Binding (per-host gateway/DNS)
EOF
          cat > $D/CONTROL/postinst <<'EOP'
#!/bin/sh
[ -n "${IPKG_INSTROOT}" ] || /etc/init.d/rpcd reload >/dev/null 2>&1 || true
exit 0
EOP
          chmod 755 $D/CONTROL/postinst
          echo "2.0" > $D/debian-binary
          (cd $D && tar --owner=0 --group=0 -czf control.tar.gz CONTROL/ && tar --owner=0 --group=0 -czf data.tar.gz usr www)
          (cd $D && tar --owner=0 --group=0 -czf /tmp/out/${P}_${V}_all.ipk debian-binary control.tar.gz data.tar.gz)
          echo "ipk ready"

      - name: Package apk (arch=all)
        run: |
          set -e
          V="1.0.0-r1"
          P="luci-app-static-gw"
          D=/tmp/pkg-apk
          rm -rf $D
          mkdir -p $D/CONTROL $D/usr/share/luci/menu.d $D/usr/share/rpcd/acl.d $D/www/luci-static/resources/view/network

          cp root/usr/share/luci/menu.d/luci-app-static-gw.json $D/usr/share/luci/menu.d/
          cp root/usr/share/rpcd/acl.d/luci-app-static-gw.json $D/usr/share/rpcd/acl.d/
          cp htdocs/luci-static/resources/view/network/static-gw.js $D/www/luci-static/resources/view/network/

          cat > $D/CONTROL/control <<EOF
Package: $P
Version: $V
Depends: luci-base, rpcd-mod-luci
Architecture: all
Section: luci
Priority: optional
Maintainer: Lemonade-22
Description: Static Address Binding (per-host gateway/DNS)
EOF
          cat > $D/CONTROL/postinst <<'EOP'
#!/bin/sh
[ -n "${IPKG_INSTROOT}" ] || /etc/init.d/rpcd reload >/dev/null 2>&1 || true
exit 0
EOP
          chmod 755 $D/CONTROL/postinst
          echo "2.0" > $D/debian-binary
          (cd $D && tar --owner=0 --group=0 -czf control.tar.gz CONTROL/ && tar --owner=0 --group=0 -czf data.tar.gz usr www)
          (cd $D && tar --owner=0 --group=0 -czf /tmp/out/${P}_${V}_all.apk debian-binary control.tar.gz data.tar.gz)
          echo "apk ready"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: /tmp/out/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg

      - name: Collect
        run: |
          find pkg -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} . \;
          ls -lh *.ipk *.apk 2>/dev/null || ls -lh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Continuous Build
          draft: false
          prerelease: true
          files: |
            *.ipk
            *.apk
          generate_release_notes: false
          body: |
            Automatic build from ${{ github.sha }}

            - `luci-app-static-gw_*_all.ipk` — OpenWrt 24.10 / opkg (all)
            - `luci-app-static-gw_*_all.apk` — OpenWrt 25+ / apk (all)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
