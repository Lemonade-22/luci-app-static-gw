name: Build ipk and apk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            label: "OpenWrt 24.10 (opkg / ipk)"
            sdk_index: "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/"
          - format: apk
            label: "OpenWrt snapshot (apk-tools 3 / apk)"
            sdk_index: "https://downloads.openwrt.org/snapshots/targets/x86/64/"

    name: build-${{ matrix.format }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with official OpenWrt SDK (${{ matrix.label }})
        run: bash Scripts/ci-build.sh "${{ matrix.format }}" "${{ matrix.sdk_index }}"

      - name: Upload ${{ matrix.format }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.format }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: error

  release:
    name: publish-latest
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected packages
        run: ls -lh dist

      - name: Publish to the 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Continuous Build
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            dist/*.ipk
            dist/*.apk
          body: |
            Automatic build from commit ${{ github.sha }}.

            | File | Target |
            | --- | --- |
            | `luci-app-static-gw_*_all.ipk` | OpenWrt 24.10 and older (opkg) |
            | `luci-app-static-gw_*_all.apk` | OpenWrt snapshot / 25.x (apk) |

            Both packages are `Architecture: all` - the application contains
            only LuCI JS/JSON and translations, no compiled code, so one file
            serves every device.

            Install:
            ```sh
            opkg install luci-app-static-gw_*_all.ipk
            apk add --allow-untrusted luci-app-static-gw_*_all.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
